# Test-only overrides. The rate limiter's PRODUCTION defaults live in
# src/main/resources/application.yml (30/10/30/30 per minute) and stay
# untouched; the integration suites make far more than 30 write requests
# within one wall-clock minute from 127.0.0.1, so the windows are raised
# here to keep feature tests independent of the limiter. The limiter itself
# is verified directly by RateLimitServiceTest (constructor-injected fake
# clock: limit-then-429, window reset, per-IP/per-bucket independence) and
# by the documented live curl 429 probe in PROJECT-NOTES.
salon.rate-limit.login-per-minute=1000000
salon.rate-limit.signup-per-minute=1000000
salon.rate-limit.booking-per-minute=1000000
salon.rate-limit.mutation-per-minute=1000000
salon.rate-limit.resend-per-minute=1000000
