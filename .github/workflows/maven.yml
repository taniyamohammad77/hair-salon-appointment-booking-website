name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# Least privilege: the job only reads the repository.
permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # DB-less unit subset (41 tests): availability slot math, booking race,
      # token/HMAC, rate limiter + interceptor + endpoint scoping, error
      # handler. No SQL Server, no AMORE_TOKEN_SECRET, no secrets of any kind.
      # backend/mvnw is tracked without the executable bit (repo born on
      # Windows), hence `sh mvnw`. The 4 @SpringBootTest suites (auth/booking/
      # legacy-gate/context) need a database and run locally instead.
      - name: Run DB-less unit tests
        working-directory: backend
        run: >
          sh mvnw -B test
          -Dtest='TokenServiceTest,AvailabilityServiceSlotMathTest,BookingServiceRaceTest,RateLimitServiceTest,RateLimitInterceptorTest,RateLimitEndpointScopingTest,GlobalExceptionHandlerTest'
